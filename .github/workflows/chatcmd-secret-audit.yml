name: ChatCMD deployment security audit

on:
  pull_request:
    paths:
      - 'infra/chatcmd-vps/**'
      - '.github/workflows/chatcmd-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
